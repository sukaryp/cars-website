<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تفاصيل السيارة | متجر الكابتن</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#0f172a;color:#fff}

header{
  padding:20px;
  background:#020617;
  display:flex;
  justify-content:space-between;
  align-items:center
}
header h1{margin:0;color:#facc15}
header a{color:#38bdf8;text-decoration:none}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px
}
@media(max-width:900px){
  .container{grid-template-columns:1fr}
}

.gallery img{
  width:100%;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.4)
}

.details{
  background:#020617;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.4)
}
.details h2{margin-top:0;color:#facc15}

.tag{
  display:inline-block;
  background:#38bdf8;
  color:#020617;
  padding:6px 12px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:15px
}
.price{
  font-size:22px;
  font-weight:800;
  margin:15px 0
}

ul{padding:0;list-style:none}
ul li{
  padding:8px 0;
  border-bottom:1px solid #1e293b;
  font-size:15px
}

.order{margin-top:30px}
.order h3{margin-bottom:15px}

.order input,.order select{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  font-size:14px
}

.order button{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:none;
  background:#facc15;
  color:#020617;
  font-size:18px;
  font-weight:800;
  cursor:pointer
}
.order button:hover{opacity:.9}

footer{
  text-align:center;
  padding:30px;
  font-size:14px;
  opacity:.7;
  margin-top:60px
}
</style>
</head>

<body>

<header>
  <h1>تفاصيل السيارة</h1>
  <a href="cars.html">⬅ الرجوع للسيارات</a>
</header>

<div class="container">

  <!-- الصورة -->
  <div class="gallery">
    <img id="carImage" src="" alt="صورة السيارة">
  </div>

  <!-- التفاصيل -->
  <div class="details">
    <span class="tag" id="carType"></span>
    <h2 id="carName"></h2>
    <div class="price" id="carPrice"></div>

    <ul id="carSpecs"></ul>

    <!-- طلب السيارة -->
    <div class="order">
      <h3>اطلب هذه السيارة</h3>

      <form id="orderForm">
        <input name="name" type="text" placeholder="الاسم الكامل" required>
        <input name="phone" type="tel" placeholder="رقم الموبايل" required>
        <input name="budget" type="number" placeholder="الميزانية المتوقعة">
        <select name="type" required>
          <option value="">نوع الطلب</option>
          <option value="استلام فوري">استلام فوري</option>
          <option value="استيراد">استيراد</option>
        </select>
        <button type="submit">إرسال الطلب</button>
      </form>
    </div>
  </div>

</div>

<footer>
  © متجر الكابتن لاستيراد السيارات
</footer>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { db } from "./js/firebase-config.js";
import {
  doc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 1️⃣ جلب ID من الرابط */
const params = new URLSearchParams(window.location.search);
const carId = params.get("id");

if (!carId) {
  alert("❌ لم يتم تحديد السيارة");
  window.location.href = "cars.html";
}

/* 2️⃣ جلب بيانات السيارة */
const carRef = doc(db, "cars", carId);
const carSnap = await getDoc(carRef);

if (!carSnap.exists()) {
  alert("❌ السيارة غير موجودة");
  window.location.href = "cars.html";
}

const car = carSnap.data();

/* 3️⃣ عرض البيانات */
document.getElementById("carImage").src =
  car.image || "https://via.placeholder.com/600x400";

document.getElementById("carName").innerText = car.name;
document.getElementById("carType").innerText = car.type;

document.getElementById("carPrice").innerText =
  "السعر: " + Number(car.price).toLocaleString() + " جنيه";

/* المواصفات */
const specs = document.getElementById("carSpecs");
specs.innerHTML = `
  <li>🔹 الوقود: ${car.fuel || "-"}</li>
  <li>🔹 المحرك: ${car.cc || "-"}</li>
  <li>🔹 الفئة: ${car.category || "-"}</li>
  <li>🔹 الدولة: ${car.country || "-"}</li>
  <li>🔹 الأوبشنات: ${(car.options || []).join(" ، ") || "-"}</li>
`;

/* 4️⃣ إرسال الطلب */
const orderForm = document.getElementById("orderForm");

orderForm.addEventListener("submit", async e => {
  e.preventDefault();

  await addDoc(collection(db, "orders"), {
    carId,
    carName: car.name,
    name: orderForm.name.value,
    phone: orderForm.phone.value,
    budget: orderForm.budget.value || "",
    type: orderForm.type.value,
    createdAt: serverTimestamp(),
    seen: false
  });

  alert("✅ تم إرسال الطلب بنجاح");
  orderForm.reset();
});
</script>

</body>
</html>
