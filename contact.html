<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصل معنا | متجر الكابتن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:'Cairo',sans-serif;background:#0f172a;color:#fff}
    header{padding:20px;background:#020617;display:flex;justify-content:space-between;align-items:center}
    header h1{margin:0;color:#facc15}
    header a{color:#38bdf8;text-decoration:none}
    .container{max-width:800px;margin:40px auto;padding:20px;background:#020617;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
    input, textarea{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;border:none;font-size:14px}
    button{width:100%;padding:15px;border-radius:14px;border:none;background:#facc15;color:#020617;font-size:18px;font-weight:800;cursor:pointer}
    button:hover{opacity:.9}
    footer{text-align:center;padding:30px;font-size:14px;opacity:.7;margin-top:60px}
  </style>
</head>
<body>

<header>
  <h1>تواصل معنا</h1>
  <a href="index.html">⬅ الرجوع للرئيسية</a>
</header>

<div class="container">
  <h2>أرسل لنا رسالة</h2>
  <form id="contactForm">
    <input name="name" type="text" placeholder="الاسم الكامل" required>
    <input name="email" type="email" placeholder="البريد الإلكتروني" required>
    <textarea name="message" rows="6" placeholder="رسالتك" required></textarea>
    <button type="submit">إرسال الرسالة</button>
  </form>
</div>

<footer>
  © متجر الكابتن لاستيراد السيارات
</footer>

<!-- Firebase -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const contactForm = document.getElementById("contactForm");
  contactForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = contactForm.name.value;
    const email = contactForm.email.value;
    const message = contactForm.message.value;

    try {
      await addDoc(collection(db, "contacts"), {
        name,
        email,
        message,
        createdAt: serverTimestamp()
      });

      alert("✅ تم إرسال رسالتك، سنتواصل معك قريبًا");
      contactForm.reset();
    } catch (error) {
      alert("❌ حصل خطأ، حاول مرة أخرى");
      console.error(error);
    }
  });
</script>

</body>
</html>
